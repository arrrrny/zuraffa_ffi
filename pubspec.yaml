name: zuraffa_ffi_workspace
description: >-
  Monorepo workspace for the zuraffa_ffi federated plugin family (app-facing
  package, platform envelope core, and the android/ios/macos adapters).
publish_to: none
version: 7.3.0

environment:
  sdk: ^3.11.0

workspace:
  - packages/zuraffa_ffi
  - packages/zuraffa_ffi_platform
  - packages/zuraffa_ffi_android
  - packages/zuraffa_ffi_ios
  - packages/zuraffa_ffi_macos

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  coverage: ^1.15.1
  mutation_test: ^1.8.1

dependencies:
  # The family members are reachable from the workspace root, so the
  # scenarios can assert the family's public contract at runtime instead of
  # reading its source text.
  zuraffa: ^7.3.0
  zuraffa_ffi: ^7.3.0
  zuraffa_ffi_platform: ^7.3.0

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0

  zuraffa:
    path: ../zuraffa
