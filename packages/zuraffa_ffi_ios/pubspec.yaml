# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_ffi_ios
description: >-
  Typed FFI support for the Zuraffa ecosystem: a pure-Dart port, module lifecycle, and typed failures behind an injected platform channel with federated adapters.
version: 0.1.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  zuraffa: ^6.2.2
  zuraffa_ffi: ^0.1.0
  zuraffa_ffi_platform: ^0.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

dependency_overrides:
  # Local development only — resolve the in-family siblings to this
  # checkout; stripped on publish.
  zuraffa_ffi:
    path: ../zuraffa_ffi
  zuraffa_ffi_platform:
    path: ../zuraffa_ffi_platform

repository: https://github.com/arrrrny/zuraffa_ffi
issue_tracker: https://github.com/arrrrny/zuraffa_ffi/issues

topics:
  - ffi
  - ios
  - clean-architecture
  - zuraffa
