# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_ffi_android
description: >-
  Typed FFI support for the Zuraffa ecosystem: a pure-Dart port, module lifecycle, and typed failures behind an injected platform channel with federated adapters.
version: 7.3.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0


dependencies:
  zuraffa: ^7.3.0
  zuraffa_ffi_platform: ^7.3.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0


repository: https://github.com/arrrrny/zuraffa_ffi
issue_tracker: https://github.com/arrrrny/zuraffa_ffi/issues

topics:
  - ffi
  - android
  - clean-architecture
  - zuraffa


resolution: workspace

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
